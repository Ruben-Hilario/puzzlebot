    num_particles: 1000
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.1
    alpha4: 0.1
    sigma_hit: 0.12
    sigma_hit_global: 0.30
    z_hit: 0.85
    z_rand: 0.15
