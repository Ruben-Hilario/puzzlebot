    beam_step_global: 3
    update_min_d: 0.05
    update_min_a: 0.12
    resample_interval: 1
    initial_pose_x: 0.0
    initial_pose_y: 0.0
    initial_pose_a: 0.0
    set_initial_pose: false
    init_pose_spread_xy: 0.40
    init_pose_spread_a: 0.30